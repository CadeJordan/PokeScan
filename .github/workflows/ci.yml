name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # opencv-python needs libGL at import time
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # CPU-only torch first, so the editable install doesn't pull the multi-GB CUDA wheels.
      # Pinned to the local version until constraints.txt lands (intent/pinned-dev-environment).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check . --output-format=github

      # slow/model/visual need real data, exported weights, or write overlays; tests use synthetic cards
      - name: Pytest
        env:
          WANDB_MODE: disabled
        run: pytest -m "not slow and not model and not visual" -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
