# Pipeline smoke-test config: trains in a few minutes on a single GPU
# against ~100 cards. Useful only to verify the train -> checkpoint ->
# export -> serve loop end-to-end. Not expected to generalize.
backbone: convnext_tiny
pretrained: true
dropout: 0.2
front_weight: 0.7

lr: 3.0e-4
weight_decay: 0.05
aux_mse_weight: 0.1

batch_size: 8
# num_workers=0 keeps the DataLoader in the parent process - mandatory
# on Windows for stability and a non-issue at this dataset size.
num_workers: 0
image_h: 840
image_w: 600
balanced_sampler: true
sampler_power: 0.5        # weights = count^-power: 0 uniform, 0.5 1/sqrt(count), 1 inverse freq
aug_strength: 1.0         # photometric aug scale (lighting/white balance only; 0 = off)
use_precrop: true
crop_card: false

max_epochs: 8
precision: 16-mixed
gradient_clip_val: 1.0
early_stop_patience: 4
monitor: val/qwk           # checkpoint + early-stop metric (MAE favours always-10)
monitor_mode: max
seed: 42
