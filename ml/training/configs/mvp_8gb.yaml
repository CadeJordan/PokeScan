# Same as mvp.yaml but smaller batch for ~8GB GPUs (dual 600x840 inputs + ConvNeXt).
backbone: convnext_tiny
pretrained: true
dropout: 0.2
front_weight: 0.7

lr: 3.0e-4
weight_decay: 0.05
aux_mse_weight: 0.1

batch_size: 4
num_workers: 2
image_h: 840
image_w: 600
balanced_sampler: true
sampler_power: 0.5        # weights = count^-power: 0 uniform, 0.5 1/sqrt(count), 1 inverse freq
aug_strength: 1.0         # photometric aug scale (lighting/white balance only; 0 = off)
use_precrop: true
crop_kinds: [card, well, unknown]  # drop "small" (often inner frames cutting off the card edge); unknown = non-PSA photos
crop_card: false

max_epochs: 30
precision: 16-mixed
gradient_clip_val: 1.0
early_stop_patience: 6
monitor: val/qwk           # checkpoint + early-stop metric (MAE favours always-10)
monitor_mode: max
seed: 42
