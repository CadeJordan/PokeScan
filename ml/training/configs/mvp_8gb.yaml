# Same as mvp.yaml but smaller batch for ~8GB GPUs (dual 600x840 inputs + ConvNeXt).
backbone: convnext_tiny
pretrained: true
dropout: 0.2
front_weight: 0.7

lr: 3.0e-4
weight_decay: 0.05
aux_mse_weight: 0.1

batch_size: 4
num_workers: 2
image_h: 840
image_w: 600
balanced_sampler: true
use_precrop: true
crop_card: false

max_epochs: 30
precision: 16-mixed
gradient_clip_val: 1.0
early_stop_patience: 6
seed: 42
