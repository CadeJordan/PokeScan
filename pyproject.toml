[project]
name = "pokescan"
version = "0.1.0"
description = "Pokemon card grading via end-to-end CNN trained on PSA cert images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pytorch-lightning>=2.4.0",
    "timm>=1.0.11",
    "coral-pytorch>=1.4.0",
    "albumentations>=1.4.18",
    "opencv-python>=4.10.0.84",
    "pillow>=10.4.0",
    "numpy>=1.26.0,<2.0",
    "scikit-learn>=1.5.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "wandb>=0.18.0",
    "tqdm>=4.66.5",
    "rich>=13.9.0",
    "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*"]
exclude = ["data*", "frontend*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "ml/tests"]
